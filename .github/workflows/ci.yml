name: CI

# Tier-1 checks: everything that can run without a model, a GPU, or Docker.
# These gate every PR. The live-model suite is nightly (see nightly.yml),
# because no hosted runner can start Ollama with a 7B model.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan commits, not just the tip

      # This repo previously had three private keys committed and later purged.
      # This job is what stops that recurring.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint + types + tests)
    runs-on: ubuntu-latest
    env:
      # The whole point of the fake provider: real code paths, no model.
      LLM_PROVIDER: fake
      STT_PROVIDER: groq # never called in tier 1; avoids importing torch
      EXEC_PROVIDER: disabled
      JWT_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.ci.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt
          # The skill parser and language analyzer silently degrade without it.
          python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Tier-1 tests (no model, no server, no Docker)
        working-directory: backend/tests
        run: python test_platform_e2e.py

      - name: Provider contract tests
        working-directory: backend/tests
        run: python test_providers.py

  frontend:
    name: Frontend (types + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Build
        run: npm run build

